<section class="relative py-24 lg:py-32 bg-lm-black border-t border-lm-graphite/30" aria-labelledby="blog-teaser-title">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-8 mb-14">
            <div class="space-y-6" appReveal="fade-up">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-px bg-lm-silver"></div>
                    <span class="text-xs text-lm-silver tracking-[0.3em] uppercase font-body">Blog</span>
                </div>
                <h2 id="blog-teaser-title"
                    class="font-display text-4xl sm:text-5xl lg:text-6xl font-800 tracking-[-0.03em] text-lm-white leading-[1.1]">
                    IDEAS PARA<br><span class="text-lm-silver">HACER CRECER</span><br>TU MARCA<span class="text-lm-violet">.</span>
                </h2>
            </div>
            <a routerLink="/blog" appReveal="fade-up" [revealDelay]="150"
                class="group inline-flex items-center gap-3 self-start lg:self-auto font-display font-700 text-sm tracking-[0.1em] text-lm-white hover:text-lm-violet transition-colors duration-300">
                VER TODOS LOS ARTÍCULOS
                <svg class="transition-transform duration-300 group-hover:translate-x-1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </a>
        </div>

        <hlm-carousel [options]="carouselOptions" class="w-full" appReveal="fade-up">
            <hlm-carousel-content class="-ml-4 lg:-ml-5">
                @for (post of posts; track post.slug) {
                <div hlmCarouselItem class="pl-4 lg:pl-5 basis-[85%] sm:basis-1/2 lg:basis-1/3">
                    <article class="group relative">
                        <div class="relative aspect-[4/3] overflow-hidden bg-lm-charcoal mb-5">
                            <img [src]="post.image" [alt]="post.imageAlt" width="800" height="534" loading="lazy" decoding="async"
                                class="absolute inset-0 w-full h-full object-cover" />
                            <span class="absolute top-4 left-4 px-3 py-1.5 bg-lm-black/80 backdrop-blur-sm text-[11px] tracking-[0.2em] uppercase font-body text-lm-white">{{ post.category }}</span>
                        </div>
                        <p class="text-xs text-lm-silver tracking-[0.2em] uppercase font-body mb-3">{{ post.readMinutes }} min de lectura</p>
                        <h3 class="font-display text-xl lg:text-2xl font-700 tracking-[-0.02em] text-lm-white leading-[1.2] group-hover:text-lm-violet transition-colors duration-300">
                            <a [routerLink]="['/blog', post.slug]" class="after:absolute after:inset-0">{{ post.title }}</a>
                        </h3>
                    </article>
                </div>
                }
            </hlm-carousel-content>

            <button hlmCarouselPrevious aria-label="Artículo anterior"
                class="hidden lg:block bg-transparent dark:bg-transparent border-0 shadow-none text-lm-white text-lg hover:scale-125 transition-all duration-300 hover:bg-transparent dark:hover:bg-transparent hover:text-lm-violet cursor-pointer">Prev</button>
            <button hlmCarouselNext aria-label="Siguiente artículo"
                class="hidden lg:block bg-transparent dark:bg-transparent border-0 shadow-none text-lm-white text-lg hover:scale-125 transition-all duration-300 hover:bg-transparent dark:hover:bg-transparent hover:text-lm-violet cursor-pointer">Next</button>
        </hlm-carousel>
    </div>
</section>
