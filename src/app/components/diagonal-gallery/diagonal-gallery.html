<!-- Degradado lateral (izquierda) por fuera y vertical por dentro, para que las piezas entren y salgan suaves -->
<div class="[mask-image:linear-gradient(to_right,transparent,black_12%)]">
    <div role="region" aria-label="Galería de piezas de campaña"
        class="relative h-[520px] sm:h-[640px] lg:h-[780px] overflow-hidden [mask-image:linear-gradient(to_bottom,transparent,black_14%,black_86%,transparent)]">
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 -rotate-12 flex justify-center gap-4 w-[150%] lg:w-[130%]">
            @for (column of columns(); track $index) {
            <div class="w-[42vw] max-w-[300px] lg:w-[300px] shrink-0">
                <div class="gd-track will-change-transform">
                    @for (copy of [0, 1]; track copy) {
                    <div class="flex flex-col gap-4 pb-4" [attr.aria-hidden]="copy === 1 ? 'true' : null">
                        @for (item of column; track item.image) {
                        <a [routerLink]="['/portafolio', item.slug]" data-cursor [attr.tabindex]="copy === 1 ? -1 : null"
                            [attr.aria-label]="'Ver caso ' + item.title"
                            class="group relative block bg-lm-graphite/60 hover:bg-lm-violet/70 p-px transition-colors duration-500">
                            <div class="relative overflow-hidden bg-lm-black">
                                <img [src]="item.image" [alt]="item.title + ' — ' + item.category" [attr.width]="item.width"
                                    [attr.height]="item.height" loading="lazy"
                                    class="block w-full h-auto brightness-90 group-hover:brightness-100 group-hover:scale-105 transition-all duration-700">
                                <div
                                    class="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-lm-black/85 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                                    <span class="block font-display text-base font-700 tracking-tight text-lm-white">{{ item.title }}</span>
                                    <span class="block text-[10px] tracking-[0.2em] uppercase font-body text-lm-silver">{{ item.category }}</span>
                                </div>
                            </div>
                        </a>
                        }
                    </div>
                    }
                </div>
            </div>
            }
        </div>
    </div>
</div>
